name: CI (Offline Tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tfgpt-sqlite:
    name: TFGPT offline tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/tfgpt
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/tfgpt/**/requirements*.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run offline tests (SQLite)
        run: python -m pytest -q

  tfgpt-postgres:
    name: TFGPT offline tests (PostgreSQL 17 + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: tfgpt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: prototype/tfgpt
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/tfgpt/**/requirements*.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run offline tests (PostgreSQL 17)
        env:
          TEST_DATABASE_URL: postgresql://postgres:dev@localhost:5432/tfgpt_test
        run: python -m pytest -q

  advisor-spike-tests:
    name: Advisor spike harness tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/advisor-spike
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototype/advisor-spike/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run spike harness offline tests
        run: python -m pytest -q tests/test_spike.py

  node-syntax-check:
    name: Landing and pilot JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check landing and pilot scripts
        run: |
          node --check tfgpt-landing/server.js
          node --check tfgpt-landing/store.js
          node --check tfgpt-pilot/server.js
          node --check tfgpt-pilot/store.js
