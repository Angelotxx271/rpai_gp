name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      - name: Scan full Git history for secrets
        id: scan
        run: |
          set +e
          /tmp/gitleaks git --redact --verbose --report-format json --report-path gitleaks-report.json . 2>&1 | tee gitleaks.log
          rc=${PIPESTATUS[0]}
          set -e
          count=$(python3 -c 'import json, pathlib; p = pathlib.Path("gitleaks-report.json"); print(len(json.loads(p.read_text())) if p.exists() and p.read_text().strip() else 0)')
          {
            echo "### Gitleaks full-history scan"
            echo "- **Version:** \`gitleaks ${GITLEAKS_VERSION}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Findings:** \`${count}\`"
            echo "- **Exit code:** \`${rc}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: |
            gitleaks-report.json
            gitleaks.log
          retention-days: 90

  tracked-file-hygiene:
    name: Tracked-file privacy and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if private, secret, or binary junk files are tracked
        run: |
          bad=$(git ls-files | grep -E '(^private/|(^|/)\.env($|\.)|(^|/)\.secrets\.env$|\.(key|pem|exe|sqlite|sqlite3|db)$|(^|/)mt5|(^|/)wget-log$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Forbidden files tracked in public repository:"
            echo "$bad"
            exit 1
          fi
          echo "Tracked-file hygiene check passed: 0 forbidden paths."

  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install --upgrade pip && python -m pip install bandit

      - name: Run Bandit security scan
        run: |
          bandit -r \
            prototype/tfgpt/shared/tfgpt_shared \
            prototype/tfgpt/web/web \
            prototype/tfgpt/advisor/advisor \
            prototype/tfgpt/harness/harness \
            prototype/tfgpt/eval/tfgpt_eval \
            prototype/advisor-spike/spike.py \
            --skip B104 \
            -ll -ii \
            -f json -o bandit-report.json
          bandit -r \
            prototype/tfgpt/shared/tfgpt_shared \
            prototype/tfgpt/web/web \
            prototype/tfgpt/advisor/advisor \
            prototype/tfgpt/harness/harness \
            prototype/tfgpt/eval/tfgpt_eval \
            prototype/advisor-spike/spike.py \
            --skip B104 \
            -ll -ii

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 90

  dependency-audit:
    name: Dependency vulnerability audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit Python requirements (pip-audit)
        run: |
          python -m pip install --upgrade pip && python -m pip install pip-audit
          for req in \
            prototype/tfgpt/shared/requirements.txt \
            prototype/tfgpt/web/requirements.txt \
            prototype/tfgpt/advisor/requirements.txt \
            prototype/tfgpt/harness/requirements.txt \
            prototype/advisor-spike/requirements.txt; do
            echo "=== Auditing $req ==="
            (cd "$(dirname "$req")" && pip-audit -r "$(basename "$req")" --progress-spinner off)
          done

      - name: Audit Node packages (npm audit, production deps)
        run: |
          for dir in tfgpt-landing tfgpt-pilot; do
            echo "=== Auditing $dir ==="
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
          done
