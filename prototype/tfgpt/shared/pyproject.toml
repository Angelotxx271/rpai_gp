[project]
name = "tfgpt-shared"
version = "0.1.0"
description = "What the TFGPT services share: settings, database helpers, internal calls, SSE, text matching"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0", "alembic>=1.13", "httpx>=0.27", "fastapi>=0.110", "pydantic>=2.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tfgpt_shared", "tfgpt_shared.eval_migrations", "tfgpt_shared.eval_migrations.versions"]

[tool.setuptools.package-data]
"tfgpt_shared.eval_migrations" = ["*.py", "*.mako"]
