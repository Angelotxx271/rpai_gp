<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; }
  }
  .bg { fill: var(--surface); }
  .title { fill: var(--ink); font-size: 24px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 15px; }
  .tick { fill: var(--muted); font-size: 13px; }
  .xl { fill: var(--ink2); font-size: 14px; }
  .note { fill: var(--muted); font-size: 12.5px; }
  .leg { fill: var(--ink2); font-size: 15px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .sep { stroke: var(--axis); stroke-width: 1; }
  .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .m { stroke: var(--surface); stroke-width: 2; }
  .c1 { stroke: var(--s1); } .m.c1 { fill: var(--s1); stroke: var(--surface); }
  .c2 { stroke: var(--s2); } .m.c2 { fill: var(--s2); stroke: var(--surface); }
  .c3 { stroke: var(--s3); } .m.c3 { fill: var(--s3); stroke: var(--surface); }
  .c4 { stroke: var(--s4); } .m.c4 { fill: var(--s4); stroke: var(--surface); }
</style>
